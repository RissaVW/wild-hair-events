<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Hair Auctions — Events</title>
<style>
  :root {
    --ink: #1c2024;
    --paper: #faf8f4;
    --panel: #ffffff;
    --line: #e4dfd6;
    --gold: #b8863f;
    --gold-dark: #8f6528;
    --muted: #6b6459;
    --good: #3f7a4f;
    --warn: #b8863f;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap');

  /* ---- Passcode gate ---- */
  #gate {
    position: fixed; inset: 0; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; flex-direction: column; gap: 18px;
  }
  #gate h1 { color: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; margin: 0; }
  #gate input {
    padding: 12px 16px; font-size: 1rem; border-radius: 8px; border: none;
    width: 220px; text-align: center; letter-spacing: 3px;
  }
  #gate button {
    padding: 10px 22px; border-radius: 8px; border: none; background: var(--gold);
    color: var(--ink); font-weight: 600; cursor: pointer; font-family: var(--font-body);
  }
  #gate button:hover { background: var(--gold-dark); color: white; }
  #gate .err { color: #e08080; font-size: 0.85rem; height: 1em; }

  /* ---- App shell ---- */
  #app { display: none; max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
  header.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  header.top h1 { font-family: var(--font-display); font-weight: 600; font-size: 2rem; margin: 0; }
  header.top .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: 0.72rem; color: var(--gold-dark); font-weight: 600; margin-bottom: 4px; }

  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px; min-width: 130px; }
  .stat .n { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; }
  .stat .l { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    font-family: var(--font-body); font-size: 0.9rem; color: var(--ink);
  }
  .controls input[type="text"] { flex: 1; min-width: 200px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  thead th {
    text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--ink); }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 0.88rem; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fbf6ee; }
  .client-name { font-weight: 600; }
  .event-name { color: var(--muted); font-size: 0.82rem; }
  .money { font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .badge.mvw { background: #eee2cf; color: var(--gold-dark); }
  .badge.iv { background: #dde6df; color: var(--good); }
  .badge.none { background: #eee; color: var(--muted); }

  #loading, #error, #empty { text-align: center; padding: 60px 0; color: var(--muted); }
  #error { color: #b04a4a; }

  footer.note { margin-top: 28px; font-size: 0.78rem; color: var(--muted); }
  tbody tr { cursor: pointer; }

  /* ---- Top nav ---- */
  .top-nav { display: flex; gap: 8px; }
  .nav-btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .nav-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav-btn:hover:not(.active) { border-color: var(--gold); color: var(--ink); }

  /* ---- Year tabs ---- */
  .year-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .year-tab {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font-body);
  }
  .year-tab.active { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .year-tab:hover:not(.active) { border-color: var(--gold-dark); }

  /* ---- Overview dashboard ---- */
  .dash-section-title { font-family: var(--font-display); font-size: 1.15rem; margin: 30px 0 12px; }
  .dash-section-title:first-child { margin-top: 0; }
  .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .dash-card .n { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
  .dash-card .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
  .dash-card.warn .n { color: #b04a4a; }
  .dash-card.good .n { color: var(--good); }

  .outstanding-list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 4px; }
  .outstanding-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 0.88rem; }
  .outstanding-row:last-child { border-bottom: none; }
  .outstanding-row:hover { background: #fbf6ee; }
  .outstanding-row .amt { font-weight: 600; color: #b04a4a; font-variant-numeric: tabular-nums; }
  .dash-empty { color: var(--muted); font-size: 0.88rem; padding: 16px 0; }

  /* ---- Checkbox fields ---- */
  .checkbox-field label { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 0.92rem; color: var(--ink); font-weight: 500; }
  .checkbox-field input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--gold-dark); }

  /* ---- Steps tracker ---- */
  .steps-tracker { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
  .step-pill {
    flex: 1; min-width: 110px; text-align: center; padding: 8px 6px; border-radius: 8px; font-size: 0.74rem;
    font-weight: 600; background: #eee; color: var(--muted); border: 1px solid var(--line);
  }
  .step-pill.done { background: #dde6df; color: var(--good); border-color: #c3d6c7; }
  .step-pill.current { background: #eee2cf; color: var(--gold-dark); border-color: var(--gold); }

  /* ---- Detail view ---- */
  #detail { display: none; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gold-dark); font-weight: 600; font-size: 0.85rem; text-decoration: none; cursor: pointer; margin-bottom: 20px; }
  .back-link:hover { color: var(--ink); }
  .detail-header { margin-bottom: 24px; }
  .detail-header h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0 0 4px; }
  .detail-header .sub { color: var(--muted); font-size: 0.9rem; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.span2 { grid-column: span 2; }
  .field label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; }
  .field input, .field textarea {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-body);
    font-size: 0.92rem; color: var(--ink); background: var(--paper);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .section-title { font-family: var(--font-display); font-size: 1.1rem; margin: 28px 0 10px; }

  .save-bar { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
  .save-btn { padding: 11px 24px; border-radius: 8px; border: none; background: var(--gold); color: var(--ink); font-weight: 600; cursor: pointer; font-family: var(--font-body); font-size: 0.9rem; }
  .save-btn:hover { background: var(--gold-dark); color: white; }
  .save-btn:disabled { opacity: 0.6; cursor: default; }
  .save-status { font-size: 0.85rem; color: var(--good); }
  .save-status.err { color: #b04a4a; }

  /* ---- Mobile card view for the events table ---- */
  .mobile-cards { display: none; }
  .event-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .event-card:active { background: #fbf6ee; }
  .event-card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .event-card .client-name { font-size: 1rem; }
  .event-card .money { font-weight: 600; }
  .event-card .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.82rem; color: var(--muted); }

  /* ---- Responsive breakpoints ---- */
  @media (max-width: 820px) {
    #app { padding: 24px 16px 60px; }
    header.top { flex-direction: column; align-items: flex-start; gap: 12px; }
    header.top h1 { font-size: 1.6rem; }
    .top-nav { width: 100%; }
    .nav-btn { flex: 1; }
    .form-grid { grid-template-columns: 1fr; padding: 18px; gap: 14px; }
    .field.span2 { grid-column: span 1; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls select { width: 100%; }
    table { display: none; }
    .mobile-cards { display: block; }
    .stats { gap: 10px; }
    .stat { flex: 1; min-width: 0; padding: 12px 14px; }
    .stat .n { font-size: 1.3rem; }
    #gate h1 { font-size: 1.3rem; padding: 0 20px; text-align: center; }
    #gate input { width: 180px; }
    .detail-header h2 { font-size: 1.35rem; }
    .save-bar { flex-wrap: wrap; }
    .save-btn { width: 100%; }
    .steps-tracker { flex-direction: column; }
    .step-pill { min-width: 0; }
  }

  @media (max-width: 480px) {
    header.top { flex-direction: column; align-items: flex-start; }
    .stats { flex-direction: column; }
    .stat { width: 100%; }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Wild Hair Auctions</h1>
  <div>
    <input id="passcode-input" type="password" placeholder="Passcode" autocomplete="off" />
  </div>
  <button onclick="checkPasscode()">Enter</button>
  <div class="err" id="gate-err"></div>
</div>

<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow">Wild Hair Auctions</div>
      <h1 id="page-title">Overview</h1>
    </div>
    <nav class="top-nav">
      <button class="nav-btn active" id="nav-overview" onclick="showView('overview')">Overview</button>
      <button class="nav-btn" id="nav-events" onclick="showView('events')">Active Events</button>
    </nav>
  </header>

  <div id="view-overview"></div>

  <div id="view-events" style="display:none;">
  <div class="stats" id="stats"></div>

  <div class="year-tabs" id="yearTabs"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search by client or event name…" oninput="render()">
    <select id="auctioneerFilter" onchange="render()">
      <option value="">All auctioneers</option>
    </select>
  </div>

  <div id="loading">Loading events…</div>
  <div id="error" style="display:none;"></div>
  <div id="empty" style="display:none;">No events match your filters.</div>
  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th data-key="client">Client</th>
        <th data-key="event_date">Date</th>
        <th data-key="venue">Venue</th>
        <th data-key="auctioneer">Auctioneer</th>
        <th data-key="guest_count">Guests</th>
        <th data-key="amount_raised">Raised</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="mobile-cards" class="mobile-cards"></div>

  <footer class="note">Pilot build — data current as of last import from Auction_Tracker.xlsx.</footer>
  </div>

  <div id="detail">
    <a class="back-link" onclick="showList()">&larr; Back to all events</a>
    <div class="detail-header">
      <h2 id="detail-client"></h2>
      <div class="sub" id="detail-eventname"></div>
    </div>

    <div class="section-title">Steps</div>
    <div class="steps-tracker" id="steps-tracker"></div>

    <div class="section-title">Event details</div>
    <div class="form-grid">
      <div class="field"><label>Event date</label><input type="date" id="f-event_date"></div>
      <div class="field"><label>Venue</label><input type="text" id="f-venue"></div>
      <div class="field"><label>Guest count</label><input type="number" id="f-guest_count"></div>
      <div class="field"><label>Bidding software</label><input type="text" id="f-bidding_software"></div>
      <div class="field"><label>Bid sheets status</label><input type="text" id="f-bid_sheets_status"></div>
      <div class="field"><label>Bid cards status</label><input type="text" id="f-bid_cards_status"></div>
      <div class="field span2"><label>Notes / event name</label><input type="text" id="f-name"></div>
    </div>

    <div class="section-title">Contract &amp; Payment</div>
    <div class="form-grid">
      <div class="field checkbox-field"><label><input type="checkbox" id="f-contract_sent"> Contract sent</label></div>
      <div class="field checkbox-field"><label><input type="checkbox" id="f-contract_signed"> Contract signed</label></div>
      <div class="field checkbox-field"><label><input type="checkbox" id="f-fee_paid_in_full"> Fee paid in full</label></div>
      <div class="field"><label>Deposit amount</label><input type="number" step="0.01" id="f-deposit_amount"></div>
    </div>

    <div class="section-title">Financials</div>
    <div class="form-grid">
      <div class="field"><label>Fee (flat)</label><input type="number" step="0.01" id="f-fee"></div>
      <div class="field"><label>Commission rate</label><input type="number" step="0.01" id="f-commission_rate"></div>
      <div class="field"><label>Actual</label><input type="number" step="0.01" id="f-actual"></div>
      <div class="field"><label>Expenses</label><input type="number" step="0.01" id="f-expenses"></div>
      <div class="field span2"><label>Amount raised</label><input type="number" step="0.01" id="f-amount_raised"></div>
    </div>

    <div class="section-title">Contact</div>
    <div class="form-grid">
      <div class="field"><label>Client / organization name</label><input type="text" id="f-client_name"></div>
      <div class="field"><label>Contact name</label><input type="text" id="f-contact_name"></div>
      <div class="field"><label>Contact email</label><input type="email" id="f-contact_email"></div>
      <div class="field"><label>1099 received</label><input type="text" id="f-tax_form_status"></div>
    </div>

    <div class="save-bar">
      <button class="save-btn" id="save-btn" onclick="saveEvent()">Save changes</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ── FILL THESE TWO IN ──────────────────────────────────────
  const SUPABASE_URL = "https://oooqjgpttzwwqaftlpbb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vb3FqZ3B0dHp3d3FhZnRscGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTQxNzcsImV4cCI6MjEwMjM5MDE3N30.9-YYCxXgJ1GAUST7t9eTYS2phXx1qZwpTUqijsc5yGI";
  const ADMIN_PASSCODE = "wildhair"; // Marissa's passcode — sees the financial Overview
  const STAFF_PASSCODE = "wildhairstaff"; // other staff (e.g. IV) — no financial Overview
  // ────────────────────────────────────────────────────────────

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function applyRoleUI() {
    const isAdmin = sessionStorage.getItem('wha_role') === 'admin';
    document.getElementById('nav-overview').style.display = isAdmin ? 'inline-block' : 'none';
    if (!isAdmin) showView('events');
  }

  function checkPasscode() {
    const val = document.getElementById('passcode-input').value;
    let role = null;
    if (val === ADMIN_PASSCODE) role = 'admin';
    else if (val === STAFF_PASSCODE) role = 'staff';

    if (role) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      sessionStorage.setItem('wha_authed', '1');
      sessionStorage.setItem('wha_role', role);
      applyRoleUI();
      loadEvents();
    } else {
      document.getElementById('gate-err').textContent = 'Incorrect passcode.';
    }
  }
  document.getElementById('passcode-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPasscode();
  });
  if (sessionStorage.getItem('wha_authed') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    applyRoleUI();
    loadEvents();
  }

  let allEvents = [];
  let sortKey = 'event_date';
  let sortDir = 'desc';

  let selectedYear = '';

  async function loadEvents() {
    const { data, error } = await sb
      .from('events')
      .select(`
        id, event_date, venue, guest_count, amount_raised, name, fee, actual, expenses,
        contract_sent, contract_signed, deposit_amount, fee_paid_in_full,
        clients ( name ),
        staff_accounts ( initials )
      `);

    document.getElementById('loading').style.display = 'none';

    if (error) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent =
        'Could not load events: ' + error.message + ' — check that the Supabase URL/key are correct and that a read policy exists on the events table.';
      return;
    }

    allEvents = data.map(e => ({
      ...e,
      client: e.clients ? e.clients.name : '—',
      auctioneer: e.staff_accounts ? e.staff_accounts.initials : null,
      year: e.event_date ? e.event_date.slice(0, 4) : ''
    }));

    populateFilters();
    buildYearTabs();
    buildOverview();
    const isMobileInit = window.matchMedia('(max-width: 820px)').matches;
    document.getElementById('table').style.display = isMobileInit ? 'none' : 'table';
    document.getElementById('mobile-cards').style.display = isMobileInit ? 'block' : 'none';
    render();
  }

  function showView(view) {
    document.getElementById('nav-overview').classList.toggle('active', view === 'overview');
    document.getElementById('nav-events').classList.toggle('active', view === 'events');
    document.getElementById('view-overview').style.display = view === 'overview' ? 'block' : 'none';
    document.getElementById('view-events').style.display = view === 'events' ? 'block' : 'none';
    document.getElementById('page-title').textContent = view === 'overview' ? 'Overview' : 'Active Events';
  }

  function buildYearTabs() {
    const years = [...new Set(allEvents.map(e => e.year).filter(Boolean))].sort().reverse();
    const wrap = document.getElementById('yearTabs');
    wrap.innerHTML = '';
    const allTab = document.createElement('button');
    allTab.className = 'year-tab active';
    allTab.textContent = 'All years';
    allTab.onclick = () => selectYear('', allTab);
    wrap.appendChild(allTab);
    years.forEach(y => {
      const tab = document.createElement('button');
      tab.className = 'year-tab';
      tab.textContent = y;
      tab.onclick = () => selectYear(y, tab);
      wrap.appendChild(tab);
    });
  }

  function selectYear(year, btn) {
    selectedYear = year;
    document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function buildOverview() {
    const withFee = allEvents.filter(e => e.fee != null);
    const totalContracted = withFee.reduce((s, e) => s + Number(e.fee || 0), 0);
    const totalDeposits = allEvents.reduce((s, e) => s + Number(e.deposit_amount || 0), 0);
    const notPaid = withFee.filter(e => !e.fee_paid_in_full);
    const totalOutstanding = notPaid.reduce((s, e) => {
      const remaining = Number(e.fee || 0) - Number(e.deposit_amount || 0);
      return s + Math.max(remaining, 0);
    }, 0);
    const signedCount = allEvents.filter(e => e.contract_signed).length;
    const sentNotSignedCount = allEvents.filter(e => e.contract_sent && !e.contract_signed).length;
    const notSentCount = allEvents.filter(e => !e.contract_sent).length;

    const html = `
      <div class="dash-section-title">Financial snapshot</div>
      <div class="dash-grid">
        <div class="dash-card warn"><div class="n">$${totalOutstanding.toLocaleString()}</div><div class="l">Outstanding balance</div></div>
        <div class="dash-card good"><div class="n">$${totalDeposits.toLocaleString()}</div><div class="l">Deposits collected</div></div>
        <div class="dash-card"><div class="n">$${totalContracted.toLocaleString()}</div><div class="l">Total contracted fees</div></div>
        <div class="dash-card"><div class="n">${notPaid.length}</div><div class="l">Events not yet paid in full</div></div>
      </div>

      <div class="dash-section-title">Contracts</div>
      <div class="dash-grid">
        <div class="dash-card good"><div class="n">${signedCount}</div><div class="l">Signed</div></div>
        <div class="dash-card warn"><div class="n">${sentNotSignedCount}</div><div class="l">Sent, awaiting signature</div></div>
        <div class="dash-card"><div class="n">${notSentCount}</div><div class="l">Not yet sent</div></div>
        <div class="dash-card"><div class="n">${allEvents.length}</div><div class="l">Total events</div></div>
      </div>

      <div class="dash-section-title">Events with an outstanding balance</div>
      <div id="outstanding-list"></div>
    `;
    document.getElementById('view-overview').innerHTML = html;

    const listEl = document.getElementById('outstanding-list');
    if (notPaid.length === 0) {
      listEl.innerHTML = '<div class="dash-empty">Nothing outstanding right now.</div>';
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'outstanding-list';
      notPaid
        .sort((a, b) => (Number(b.fee || 0) - Number(b.deposit_amount || 0)) - (Number(a.fee || 0) - Number(a.deposit_amount || 0)))
        .slice(0, 15)
        .forEach(e => {
          const remaining = Math.max(Number(e.fee || 0) - Number(e.deposit_amount || 0), 0);
          const row = document.createElement('div');
          row.className = 'outstanding-row';
          row.innerHTML = `<span>${escapeHtml(e.client)}${e.event_date ? ' · ' + e.event_date : ''}</span><span class="amt">$${remaining.toLocaleString()}</span>`;
          row.addEventListener('click', () => { showView('events'); openDetail(e.id); });
          wrap.appendChild(row);
        });
      listEl.appendChild(wrap);
    }
  }

  function populateFilters() {
    const auctioneers = [...new Set(allEvents.map(e => e.auctioneer).filter(Boolean))].sort();
    const aSel = document.getElementById('auctioneerFilter');
    aSel.innerHTML = '<option value="">All auctioneers</option>';
    auctioneers.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      aSel.appendChild(opt);
    });
  }

  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = key; sortDir = 'asc'; }
      render();
    });
  });

  function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const auct = document.getElementById('auctioneerFilter').value;

    let rows = allEvents.filter(e => {
      const matchesSearch = !search ||
        (e.client && e.client.toLowerCase().includes(search)) ||
        (e.name && e.name.toLowerCase().includes(search));
      const matchesYear = !selectedYear || e.year === selectedYear;
      const matchesAuct = !auct || e.auctioneer === auct;
      return matchesSearch && matchesYear && matchesAuct;
    });

    rows.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'client') { av = a.client; bv = b.client; }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = rows.length ? 'none' : 'block';

    rows.forEach(e => {
      const tr = document.createElement('tr');
      const badgeClass = e.auctioneer === 'MVW' ? 'mvw' : e.auctioneer === 'IV' ? 'iv' : 'none';
      tr.innerHTML = `
        <td>
          <div class="client-name">${escapeHtml(e.client)}</div>
          ${e.name ? `<div class="event-name">${escapeHtml(e.name)}</div>` : ''}
        </td>
        <td>${e.event_date || '—'}</td>
        <td>${escapeHtml(e.venue || '—')}</td>
        <td><span class="badge ${badgeClass}">${e.auctioneer || 'Unassigned'}</span></td>
        <td>${e.guest_count ?? '—'}</td>
        <td class="money">${e.amount_raised ? '$' + Number(e.amount_raised).toLocaleString() : '—'}</td>
      `;
      tr.addEventListener('click', () => openDetail(e.id));
      tbody.appendChild(tr);
    });

    const cardsWrap = document.getElementById('mobile-cards');
    cardsWrap.innerHTML = '';
    rows.forEach(e => {
      const badgeClass = e.auctioneer === 'MVW' ? 'mvw' : e.auctioneer === 'IV' ? 'iv' : 'none';
      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="row1">
          <div>
            <div class="client-name">${escapeHtml(e.client)}</div>
            ${e.name ? `<div class="event-name">${escapeHtml(e.name)}</div>` : ''}
          </div>
          <div class="money">${e.amount_raised ? '$' + Number(e.amount_raised).toLocaleString() : '—'}</div>
        </div>
        <div class="row2">
          <span>${e.event_date || '—'}${e.venue ? ' · ' + escapeHtml(e.venue) : ''}</span>
          <span class="badge ${badgeClass}">${e.auctioneer || 'Unassigned'}</span>
        </div>
      `;
      card.addEventListener('click', () => openDetail(e.id));
      cardsWrap.appendChild(card);
    });

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Events shown</div></div>
      <div class="stat"><div class="n">$${rows.reduce((s, e) => s + (Number(e.amount_raised) || 0), 0).toLocaleString()}</div><div class="l">Total raised</div></div>
    `;
  }

  let currentEventId = null;
  let currentClientId = null;

  async function openDetail(eventId) {
    const { data, error } = await sb
      .from('events')
      .select(`
        id, name, event_date, venue, guest_count, bidding_software,
        bid_sheets_status, bid_cards_status, fee, commission_rate, actual, expenses, amount_raised,
        contract_sent, contract_signed, deposit_amount, fee_paid_in_full,
        client_id, clients ( id, name, contact_name, contact_email, tax_form_status )
      `)
      .eq('id', eventId)
      .single();

    if (error) {
      alert('Could not load this event: ' + error.message);
      return;
    }

    currentEventId = data.id;
    currentClientId = data.client_id;

    document.getElementById('detail-client').textContent = data.clients ? data.clients.name : 'Unknown client';
    document.getElementById('detail-eventname').textContent = data.name || '';

    setVal('f-event_date', data.event_date);
    setVal('f-venue', data.venue);
    setVal('f-guest_count', data.guest_count);
    setVal('f-bidding_software', data.bidding_software);
    setVal('f-bid_sheets_status', data.bid_sheets_status);
    setVal('f-bid_cards_status', data.bid_cards_status);
    setVal('f-name', data.name);
    setVal('f-fee', data.fee);
    setVal('f-commission_rate', data.commission_rate);
    setVal('f-actual', data.actual);
    setVal('f-expenses', data.expenses);
    setVal('f-amount_raised', data.amount_raised);
    setVal('f-client_name', data.clients ? data.clients.name : '');
    setVal('f-contact_name', data.clients ? data.clients.contact_name : '');
    setVal('f-contact_email', data.clients ? data.clients.contact_email : '');
    setVal('f-tax_form_status', data.clients ? data.clients.tax_form_status : '');
    setVal('f-deposit_amount', data.deposit_amount);
    document.getElementById('f-contract_sent').checked = !!data.contract_sent;
    document.getElementById('f-contract_signed').checked = !!data.contract_signed;
    document.getElementById('f-fee_paid_in_full').checked = !!data.fee_paid_in_full;

    renderStepsTracker(data);

    document.getElementById('save-status').textContent = '';
    document.getElementById('app').querySelector('header.top').style.display = 'none';
    document.getElementById('view-events').style.display = 'none';
    document.getElementById('detail').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function renderStepsTracker(data) {
    const eventPassed = data.event_date && new Date(data.event_date) < new Date();
    const steps = [
      { label: 'Contract sent', done: !!data.contract_sent },
      { label: 'Contract signed', done: !!data.contract_signed },
      { label: 'Deposit received', done: !!data.deposit_amount },
      { label: 'Event held', done: !!eventPassed },
      { label: 'Paid in full', done: !!data.fee_paid_in_full },
    ];
    let currentSet = false;
    const html = steps.map(s => {
      let cls = 'step-pill';
      if (s.done) cls += ' done';
      else if (!currentSet) { cls += ' current'; currentSet = true; }
      return `<div class="${cls}">${s.done ? '✓ ' : ''}${s.label}</div>`;
    }).join('');
    document.getElementById('steps-tracker').innerHTML = html;
  }

  function showList() {
    document.getElementById('detail').style.display = 'none';
    document.getElementById('app').querySelector('header.top').style.display = 'flex';
    document.getElementById('view-events').style.display = 'block';
    const isMobile = window.matchMedia('(max-width: 820px)').matches;
    document.getElementById('table').style.display = isMobile ? 'none' : 'table';
    document.getElementById('mobile-cards').style.display = isMobile ? 'block' : 'none';
    buildOverview();
  }

  function setVal(id, val) {
    document.getElementById(id).value = val ?? '';
  }
  function getVal(id) {
    const v = document.getElementById(id).value;
    return v === '' ? null : v;
  }
  function getNum(id) {
    const v = document.getElementById(id).value;
    return v === '' ? null : Number(v);
  }
  function getChecked(id) {
    return document.getElementById(id).checked;
  }

  async function saveEvent() {
    const btn = document.getElementById('save-btn');
    const status = document.getElementById('save-status');
    btn.disabled = true;
    status.className = 'save-status';
    status.textContent = 'Saving…';

    const eventUpdate = {
      event_date: getVal('f-event_date'),
      venue: getVal('f-venue'),
      guest_count: getNum('f-guest_count'),
      bidding_software: getVal('f-bidding_software'),
      bid_sheets_status: getVal('f-bid_sheets_status'),
      bid_cards_status: getVal('f-bid_cards_status'),
      name: getVal('f-name'),
      fee: getNum('f-fee'),
      commission_rate: getNum('f-commission_rate'),
      actual: getNum('f-actual'),
      expenses: getNum('f-expenses'),
      amount_raised: getNum('f-amount_raised'),
      contract_sent: getChecked('f-contract_sent'),
      contract_signed: getChecked('f-contract_signed'),
      fee_paid_in_full: getChecked('f-fee_paid_in_full'),
      deposit_amount: getNum('f-deposit_amount'),
    };
    const clientUpdate = {
      name: getVal('f-client_name'),
      contact_name: getVal('f-contact_name'),
      contact_email: getVal('f-contact_email'),
      tax_form_status: getVal('f-tax_form_status'),
    };

    const { error: e1 } = await sb.from('events').update(eventUpdate).eq('id', currentEventId);
    const { error: e2 } = await sb.from('clients').update(clientUpdate).eq('id', currentClientId);

    btn.disabled = false;
    if (e1 || e2) {
      status.className = 'save-status err';
      status.textContent = 'Could not save: ' + ((e1 && e1.message) || (e2 && e2.message));
    } else {
      status.className = 'save-status';
      status.textContent = 'Saved.';
      renderStepsTracker({
        event_date: getVal('f-event_date'),
        contract_sent: getChecked('f-contract_sent'),
        contract_signed: getChecked('f-contract_signed'),
        deposit_amount: getNum('f-deposit_amount'),
        fee_paid_in_full: getChecked('f-fee_paid_in_full'),
      });
      loadEvents(); // refresh underlying list/dashboard data silently
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
